# ─────────────────────────────────────────────────────────────
# Streamlit-ийн үндсэн загвар — Монос Группын брэнд өнгө
#
# ⚠️ Streamlit-ийн анхдагч `primaryColor` нь УЛААН (#FF4B4B) бөгөөд
#    товч, фокусын хүрээ, слайдер зэрэгт хэрэглэгддэг. CSS-ээр дарж
#    болох ч эх үүсвэрээс нь зассан нь найдвартай — шинэ элемент
#    нэмэгдэхэд ч автоматаар брэндийн өнгөтэй байна.
#
# ⚠️ `base = "light"` — аппын CSS нь ЗӨВХӨН цайвар горимд зориулагдсан.
#    Хэрэглэгчийн систем бараан горимд байвал Streamlit бараан суурь
#    сонгож, бичиг уншигдахгүй болох эрсдэлтэй.
# ─────────────────────────────────────────────────────────────

[theme]
base = "light"
primaryColor = "#078b4e"            # Монос ногоон — үйлдлийн өнгө
textColor = "#122333"               # Шөнийн цэнхэр — брэндийн бэх
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#ffffff"

[server]
# Excel файл 25 MB хүртэл (Data AI.xlsx ≈ 1 MB — өсөх зайтай)
maxUploadSize = 25

[browser]
gatherUsageStats = false
